<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Voix</title>
<meta name="description" content="Devenir un meilleur communicant : des fiches courtes sur le fond, la voix, le corps et l'échange, et des flashcards de vocabulaire.">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Voix">
<style>
/* Minimal, system-native: grouped lists, large titles, one accent. One screen at a time; bottom tab bar. */
:root{
  color-scheme:light;
  --bg:#f5f5f7; --card:#ffffff; --fill:#f0f0f3; --ink:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7;
  --accent:#0071e3; --accent-soft:#e8f1fc; --on-accent:#ffffff;
  --ok:#248a3d; --near:#b25000; --off:#d70015; --ok-soft:#e3f5e8;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,"Roboto Mono",monospace;
  --r:18px;
  --tabh:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1c1c1e; --fill:#2c2c2e; --ink:#f5f5f7; --muted:#98989d; --line:#38383a;
  --accent:#2997ff; --accent-soft:#0b2a4a; --on-accent:#000000;
  --ok:#30d158; --near:#ffd60a; --off:#ff453a; --ok-soft:#0f2e18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --fill:#2c2c2e; --ink:#f5f5f7; --muted:#98989d; --line:#38383a;
  --accent:#2997ff; --accent-soft:#0b2a4a; --on-accent:#000000;
  --ok:#30d158; --near:#ffd60a; --off:#ff453a; --ok-soft:#0f2e18; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.47;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2{text-wrap:balance}
.wrap{max-width:640px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.screen{padding-block:16px calc(var(--tabh) + 40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:15px}
.xs{font-size:13px}

/* Titles */
.large{font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.sub{color:var(--muted);font-size:15px;margin-top:2px}
.section-label{font-size:13px;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);padding:0 16px 6px}
.foot-note{font-size:13px;color:var(--muted);padding:6px 16px 0}

/* Grouped lists */
.group{background:var(--card);border-radius:var(--r);overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:52px;position:relative;background:none;border:0;width:100%;text-align:left}
.cell+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line);transform:scaleY(.5)}
.cell .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto;font-size:15px;font-weight:700;color:#fff}
.cell .t{flex:1;min-width:0}
.cell .t b{display:block;font-weight:600}
.cell .t span{display:block;font-size:14px;color:var(--muted)}
.cell .val{color:var(--muted);font-size:15px;white-space:nowrap}
.cell .chev{color:var(--muted);font-size:20px;line-height:1}
.cell.cur .t b{color:var(--accent)}
.ic.chant{background:#5e5ce6}.ic.voix{background:#30b0c7}.ic.parole{background:#ff9f0a}.ic.bilan{background:#34c759}.ic.defi{background:#ff375f}.ic.n{background:var(--fill);color:var(--muted)}

/* Buttons */
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600;background:var(--fill);color:var(--ink);line-height:1.2;min-height:44px}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.big{width:100%;min-height:52px;font-size:17px;border-radius:14px}
.btn.sm{min-height:34px;padding:7px 14px;font-size:15px;border-radius:10px}
.btn.ghost{background:none;color:var(--accent);padding-inline:0}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:8px;padding:6px max(12px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.tab{flex:1;max-width:140px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:11px;font-weight:500}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--accent)}

/* Home */
.hero-card{background:var(--card);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px}
header .eyebrow{margin:0 0 2px;font-size:13px;color:#30b0c7;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.hero-card .eyebrow{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.week{display:flex;gap:6px}
.week i{flex:1;height:6px;border-radius:3px;background:var(--fill)}
.week i.on{background:var(--accent)}

/* Session */
.s-top{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px}
.s-top .where{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.s-top .where span{font-size:13px;color:var(--muted);font-weight:600}
.bar{height:4px;background:var(--fill);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.close{width:34px;height:34px;border-radius:50%;border:0;background:var(--fill);color:var(--muted);font-size:17px;display:grid;place-items:center;flex:0 0 auto}
.kicker{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.kicker.chant{color:#5e5ce6}.kicker.voix{color:#30b0c7}.kicker.parole{color:#ff9f0a}.kicker.bilan{color:var(--ok)}
.s-title{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:4px}
.s-body{display:flex;flex-direction:column;gap:16px;min-width:0}
.s-foot{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px max(20px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.s-foot .btn{max-width:600px;margin:0 auto;display:block}
.card{background:var(--card);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.tint{background:var(--accent-soft)}
.lede{font-size:19px;line-height:1.45;font-weight:500}
.prose{font-size:17px;line-height:1.6}
.label{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
.keep{font-weight:600}
details.more{background:var(--card);border-radius:var(--r);padding:14px 18px}
details.more summary{cursor:pointer;font-weight:600;color:var(--accent);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:10px}
details.more ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:8px}
.clock{font-family:var(--mono);font-size:44px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.timer{display:flex;align-items:center;justify-content:space-between;gap:16px}
.timer.end .clock{color:var(--ok)}
.say{font-size:17px;font-weight:600;min-height:1.5em}
.cue{font-size:40px;font-weight:700;text-align:center;letter-spacing:-.02em;min-height:1.2em}
.result{font-size:16px;line-height:1.5}
.result b{font-family:var(--mono);font-weight:600}
.warn{background:color-mix(in srgb,var(--off) 10%,var(--card));border-radius:14px;padding:14px 16px;font-size:15px;display:flex;flex-direction:column;gap:8px}
.warn b{color:var(--off)}
.topic{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.banner{background:var(--accent);color:var(--on-accent);border-radius:14px;padding:14px 16px;font-size:18px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:14px;padding:6px 12px;border-radius:999px;background:var(--fill);border:0;font-family:var(--mono)}
.chip.cur{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.ko{background:color-mix(in srgb,var(--off) 14%,var(--card));color:var(--off)}
button.chip{font-family:var(--font)}
button.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.counters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.counter{border:0;border-radius:14px;padding:16px 10px;background:var(--fill);font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
.counter b{font-family:var(--mono);font-size:26px}
.counter span{font-size:13px;color:var(--muted)}
.counter:disabled{opacity:.45}
.take{background:var(--card);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.fields{display:flex;flex-direction:column;gap:10px}
.fields label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.fields input,textarea{background:var(--fill);border:0;border-radius:10px;padding:11px 12px;font-size:17px;font-weight:400;color:var(--ink);width:100%}
textarea{min-height:84px;resize:vertical}
.stars{display:flex;gap:8px}
.stars button{flex:1;height:44px;border-radius:12px;border:0;background:var(--fill);font-weight:600}
.stars button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.checks{display:flex;flex-direction:column;gap:8px}
.checks label{display:flex;gap:10px;align-items:center;font-size:16px}
.checks input{width:22px;height:22px;accent-color:var(--accent)}
.emo{display:flex;flex-direction:column;gap:8px;padding:14px;background:var(--fill);border-radius:14px}
.emo b{font-size:17px}
audio{width:100%;height:40px}

/* Pitch widget */
.pw{display:flex;flex-direction:column;gap:10px}
.pw-top{display:flex;justify-content:space-between;align-items:baseline}
.pw-n{font-size:34px;font-weight:700;letter-spacing:-.02em}
.pw-sci{color:var(--muted);font-size:14px;font-family:var(--mono);margin-left:6px}
.pw-c{font-weight:600;font-size:15px}
.needle{position:relative;height:8px;border-radius:4px;background:var(--fill)}
.needle .zone{position:absolute;top:0;bottom:0;background:var(--ok-soft);border-radius:4px}
.needle .mid{position:absolute;top:-4px;bottom:-4px;left:50%;width:2px;margin-left:-1px;background:var(--line)}
.needle .pin{position:absolute;top:-5px;width:18px;height:18px;margin-left:-9px;left:50%;border-radius:50%;background:var(--muted);box-shadow:0 1px 4px rgb(0 0 0/.25);transition:left .06s linear}
.roll{width:100%;height:200px;display:block;border-radius:14px;background:var(--fill)}
.meter{height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .08s linear}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ===== Structure en fiches ===== */
.ic.parole{background:#ff9f0a}.ic.voix{background:#30b0c7}.ic.corps{background:#34c759}.ic.echange{background:#5e5ce6}.ic.mots{background:#ff375f}
.eyebrow{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);margin:0 0 4px}
.eyebrow.parole{color:#c77700}.eyebrow.voix{color:#1f8ea3}.eyebrow.corps{color:var(--ok)}.eyebrow.echange{color:#5e5ce6}.eyebrow.mots{color:#e0244a}
.title{font-size:30px;font-weight:700;letter-spacing:-.022em;line-height:1.12}
.back{align-self:flex-start;background:none;border:0;color:var(--accent);font-size:17px;padding:4px 0;margin-bottom:-10px;display:flex;gap:4px;align-items:center}
.back span{font-size:26px;line-height:1;margin-top:-3px}
.keycard{background:var(--accent-soft);border-radius:var(--r);padding:18px 20px}
.keycard p{font-size:21px;font-weight:600;line-height:1.35;letter-spacing:-.015em}
.seg{display:flex;background:var(--fill);border-radius:12px;padding:3px;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:5;box-shadow:0 0 0 6px var(--bg)}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-size:15px;font-weight:600;color:var(--muted);min-height:36px}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.12)}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
.steps li{counter-increment:s;display:flex;gap:12px;line-height:1.45}
.steps li::before{content:counter(s);flex:0 0 26px;height:26px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--muted)}
.ex{display:flex;flex-direction:column;gap:2px;line-height:1.45}
.ex span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.ex.bad{color:var(--muted)}.ex.bad span{color:var(--off)}
.ex.good{font-weight:500}.ex.good span{color:var(--ok)}
.daily{font-size:21px;font-weight:600;line-height:1.4;letter-spacing:-.015em}
.ticks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.ticks li{padding-left:24px;position:relative;line-height:1.45}
.ticks li::before{content:"○";position:absolute;left:0;color:var(--muted)}
.seen{color:var(--ok);font-weight:700}
.hero{background:var(--card);border-radius:var(--r);padding:24px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.hero .btn{margin-top:12px}
.big-num{font-size:56px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.rv-top{display:flex;justify-content:space-between;align-items:center}
.rv-top .back{margin:0}
.flash{background:var(--card);border-radius:22px;padding:28px 22px;min-height:300px;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
.flash-w{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.flash-d{font-size:21px;font-weight:500;line-height:1.4}
.flash-back{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:8px}
.flash-a{font-size:30px;font-weight:700;color:var(--accent);letter-spacing:-.02em}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.danger{background:none;color:var(--off)}
.opt{font-weight:400;text-transform:none;letter-spacing:0}

/* ===== Entraînements ===== */
body.focus .tabbar{display:none}
.drill{align-items:stretch;text-align:left;gap:4px}
.drill-t{font-size:24px;font-weight:700;letter-spacing:-.02em}
.drill .btn{margin-top:14px}
.keycard .xs-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--accent);margin-bottom:6px;line-height:1.3}
.switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;flex:0 0 auto;transition:background .2s;margin:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0/.3);transition:transform .2s}
.switch:checked{background:var(--ok)}.switch:checked::after{transform:translateX(20px)}
.yn-row{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.label+.yn-row{border-top:0;padding-top:0}
.yn2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yn2 button{border:0;border-radius:10px;min-height:40px;background:var(--fill);font-weight:600}
.yn2 button[data-v="1"][aria-pressed="true"]{background:var(--ok);color:#fff}
.yn2 button[data-v="0"][aria-pressed="true"]{background:var(--off);color:#fff}
.wrote{margin:0;display:grid;gap:4px}
.wrote dt{font-size:13px;color:var(--muted);font-weight:600;margin-top:6px}
.wrote dd{margin:0;font-weight:500}
.read{font-size:20px;line-height:1.55}
.annot{font-size:20px;line-height:2;margin:0}
.w{border:0;background:none;padding:2px 1px;border-radius:6px;font:inherit;color:inherit}
.w.s1{background:var(--accent-soft);color:var(--accent);font-weight:700}
.w.s2::after{content:" /";color:var(--off);font-weight:700}
.annot.ro .w{pointer-events:none}
.legend{display:flex;gap:12px}.legend .w{font-size:13px}
.pass{color:var(--ok);font-weight:700}.fail{color:var(--off);font-weight:700}
.card.ok-tint{background:var(--ok-soft)}
</style>
</head>
<body>
<main class="screen wrap" id="view"></main>
<nav class="tabbar" aria-label="Navigation">

  <button class="tab" data-go="voix"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>Voix</button>
  <button class="tab" data-go="hasard" aria-label="Fiche au hasard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3.5"/><circle cx="9" cy="9" r="1.1" fill="currentColor"/><circle cx="15" cy="15" r="1.1" fill="currentColor"/><circle cx="15" cy="9" r="1.1" fill="currentColor"/><circle cx="9" cy="15" r="1.1" fill="currentColor"/><circle cx="12" cy="12" r="1.1" fill="currentColor"/></svg>Hasard</button>
  <button class="tab" data-go="corps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="2"/><path d="M5 9l7 1.5L19 9M12 10.5V15M12 15l-3.5 6M12 15l3.5 6"/></svg>Corps</button>
  <button class="tab" data-go="mots"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="13" height="16" rx="2"/><path d="M8 9h5M8 13h3M20 7v12a2 2 0 0 1-2 2H8"/></svg>Mots</button>
</nav>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
